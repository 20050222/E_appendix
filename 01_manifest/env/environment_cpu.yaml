# E题：集成显卡/CPU 环境
# 集成显卡不使用 CUDA device；PyTorch 使用 CPU wheel。
name: cpmcm-e-cpu
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.9
  - numpy=1.26.4
  - pandas=2.2.3
  - pip
  - pip:
      - transformers==4.49.0
      - librosa==0.10.2.post1
      - opencv-contrib-python==4.11.0.86
      - mediapipe==0.10.21
      - imageio-ffmpeg==0.6.0
      - matplotlib==3.9.4
      - openpyxl==3.1.5
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.6.0

# 安装后验证：
# python -c "import torch; print(torch.__version__, torch.cuda.is_available()); assert not torch.cuda.is_available()"
# 运行设备：cpu
# 随机种子：42
